<!DOCTYPE html>
<html>
  <head>
    <title>DOM Projects</title>
  </head>

  <style>
    body {
      font-family: Arial;
    }

    .subscribe-button {
      border: none;
      background-color: black;
      color: white;
      /* padding-top: 10px;
      padding-bottom: 10px; */
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .is-subscribed {
      background-color: rgb(240, 240, 240);
      color: black;
    }

    .cost-input {
      font-size: 15px;
      /* padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 10px;
      padding-right: 10px; */
      padding: 10px;
    }

    .calculate-button {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      padding: 12px 15px;
      cursor: pointer;
    }

    .error {
      color: red;
    }
  </style>

  <body>
    <p>YouTube Subscribe Button</p>
    <button
      onclick=" subscribe();
    
    "
      class="js-subscribe-button subscribe-button"
    >
      Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <!-- <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p> -->

    <input
      class="js-cost-input cost-input"
      placeholder="Cost of order"
      onkeydown="
      handleCostKeydown(event);
    // console.log(event.key);
    "
    />

    <button
      onclick=" 
    calculateTotal();
    "
      class="calculate-button"
    >
      Calculate
    </button>

    <p class="js-total-cost"></p>
    <script>
      String(25);
      console.log("25" - 5);
      console.log("25" + 5);

      window.document;
      console.log(window.console);
      window.alert;

      function subscribe() {
        const buttonElement = document.querySelector(".js-subscribe-button");

        if (buttonElement.innerText === "Subscribe") {
          buttonElement.innerHTML = "Subscribed";
          buttonElement.classList.add("is-subscribed");
        } else {
          buttonElement.innerHTML = "Subscribe";
          buttonElement.classList.remove("is-subscribed");
        }
      }

      function calculateTotal() {
        let inputElement = document.querySelector(".js-cost-input");
        let cost = Number(inputElement.value);
        if (cost < 0) {
          const errorInput = document.querySelector(".js-total-cost");
          errorInput.innerHTML = "Error: cost cannot be less than $0";
          errorInput.classList.add("error");
        } else if (cost < 40 && cost > 0) {
          cost = cost + 10;
          document.querySelector(".js-total-cost").innerHTML = "$" + cost;
        } else {
          document.querySelector(".js-total-cost").innerHTML = "$" + cost;
        }
      }

      function handleCostKeydown(event) {
        if (event.key === "Enter") {
          calculateTotal();
        }
      }
    </script>
  </body>
</html>
