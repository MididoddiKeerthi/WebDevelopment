<!DOCTYPE html>
<html>
  <head>
    <title>HTML CSS Review</title>
    <style>
      /* This is a CSS comment*/
      .red-button {
        background-color: red;
        color: white;
        border: none;
      }

      .yellow-button {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <!--
    This is a HTML Comment
    -->
    <button
      title="hello"
      class="red-button"
      onclick="
      alert('Good job!');
      "
    >
      hello
    </button>
    <p>paragraph of <button class="yellow-button">hello</button> text</p>

    <script>
      //This is single line comment
      //This code creates a popup.
      //alert("hello");
      /* JS Multiline Comment*/
      console.log(2 + 2);
      console.log("some" + "text");
    </script>
  </body>
</html>
