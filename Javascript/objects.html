<!DOCTYPE html>
<html>
  <head>
    <title>Objects</title>
  </head>
  <body>
    <script>
      const product = {
        name: "socks",
        price: 1090,
      };
      console.log(product);
      console.log(product.name);
      console.log(product.price);

      //changing the value
      product.name = "cotton socks";
      console.log(product.name); //Dot Notation

      //Adding a new value or property
      product.newProperty = true;
      console.log(product);

      //Deleting the value from an object
      delete product.newProperty;
      console.log(product);

      const product2 = {
        name: "shirt",
        "delivery-time": "1 day",
        rating: {
          //Nested Object
          stars: 4.5,
          count: 87,
        },
        fun: function function1() {
          console.log("function inside object");
        },
      };

      console.log(product2);
      console.log(product2.name);
      console.log(product2["name"]);
      console.log(product2["delivery-time"]); //Bracket Notation

      console.log(product2.rating.stars);
      console.log(product2.rating["count"]);

      product2.fun();

      console.log(typeof console); //Object
      console.log(typeof console.log); //function(Method) Log is a function in an object

      //converts javaScript Object to JSON
      console.log(JSON.stringify(product2));
      console.log(typeof JSON.stringify(product2)); //string

      //convert JSON Object to JS Object
      const jsonString = JSON.stringify(product2);
      console.log(JSON.parse(jsonString));

      console.log("hello".length); //5
      console.log("hello".toUpperCase());

      const object1 = {
        //reference
        message: "hello",
      };

      const object2 = object1; //copy by references

      object1.message = "Good job!";
      console.log(object1);
      console.log(object2);

      const object3 = {
        message: "Good job!",
      };

      console.log(object3 === object1); //false
      console.log(object1 === object2); //true

      const object4 = {
        message: "Good job!",
        price: 799,
      };
      // const message = object4.message;
      const { message, price } = object4; //destructring(shorcut for the above one)

      console.log(message, price);

      const object5 = {
        //message: message,
        message, //shorthand property
        // method: function function1() {
        //   console.log("method");
        // },
        method() {
          //shorthand Method
          console.log("method");
        },
      };

      console.log(object5);
      object5.method();
    </script>
  </body>
</html>
