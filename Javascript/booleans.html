<!DOCTYPE html>
<html>
  <head>
    <title>Booleans</title>
  </head>
  <body>
    <script>
      true;
      false;

      console.log(3 > 5);

      console.log(2 === "2.00");

      if (false) {
        console.log("hello");
      } else {
        console.log("else");
      }

      const age = 15;

      if (age >= 16) {
        console.log("You can drive");
        console.log("Congrats");
      } else if (age >= 14) {
        console.log("Almost there");
      } else {
        console.log("You can not drive");
      }

      //Logical Operators
      //AND(&&) Operator
      console.log(true && false);
      console.log(0.2 >= 0 && 0.2 < 1 / 3);

      //OR(||) Operator
      console.log(true || false);

      //!(not) operator
      console.log(!true);

      if (0) {
        console.log("truthy");
      }

      let cartQuantity = 5;

      if (cartQuantity) {
        console.log("cart has products");
      }

      console.log(!0);

      console.log("text" / 5);

      let variable1;
      console.log(variable1);

      //Ternary Operator

      const result = 0 ? "truthy" : "falsy";
      console.log(result);

      false && console.log("hello");

      const message = true && "hello";
      console.log(message);

      const currency = "EUR" || "USD";
      console.log(currency);
    </script>
  </body>
</html>
